name: CI

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check version metadata
        run: npm run check:versions

      - name: Verify release automation
        run: npm run test:release

      - name: Build library
        run: npm run build:lib

      - name: Verify npm package
        run: npm run check:package

      - name: Check library bundle size
        run: npm run check:bundle-size

      - name: Check production consumer bundles
        run: npm run check:consumer-performance

      - name: Test packed library installation
        run: npm run check:packed-install

      - name: Build MCP server
        run: npm run build:mcp

      - name: Verify MCP package
        run: npm run check:mcp-package

      - name: Verify theme generator CLI
        run: npm run test:theme-cli

      - name: Verify ng add initializer
        run: npm run test:ng-add

      - name: Test library
        run: npm run test:lib

      - name: Test documentation
        run: npm run test:docs

      - name: Test MCP server
        run: npm run test:mcp

      - name: Build documentation
        run: npm run test:doc-performance && npm run build:docs

  browser:
    name: browser
    env:
      AERIS_E2E_BUILT_APPS: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build library
        run: npm run build:lib

      - name: Run browser regression tests
        # Build once; individual tests must not race dev-server compilation or HMR.
        run: npm run test:browser-server && npm run build:browser-apps && npm run test:e2e:critical

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build library
        run: npm run build:lib
      - name: Compare reviewed visual baselines
        run: npm run test:e2e:visual
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
