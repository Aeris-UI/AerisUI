name: CI

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check version metadata
        run: npm run check:versions

      - name: Verify release automation
        run: npm run test:release

      - name: Build library
        run: npm run build:lib

      - name: Verify npm package
        run: npm run check:package

      - name: Check library bundle size
        run: npm run check:bundle-size

      - name: Test packed library installation
        run: npm run check:packed-install

      - name: Build MCP server
        run: npm run build:mcp

      - name: Verify MCP package
        run: npm run check:mcp-package

      - name: Verify theme generator CLI
        run: npm run test:theme-cli

      - name: Verify ng add initializer
        run: npm run test:ng-add

      - name: Test library
        run: npm run test:lib

      - name: Test documentation
        run: npm run test:docs

      - name: Test MCP server
        run: npm run test:mcp

      - name: Build documentation
        run: npm run build:docs

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build library
        run: npm run build:lib

      - name: Run browser regression tests
        run: npm run test:e2e:critical

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
