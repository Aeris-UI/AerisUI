<aeris-dialog
  class="docs-command-dialog"
  [(visible)]="visible"
  position="top"
  width="min(38.75rem, calc(100vw - 2.25rem))"
  maxHeight="min(36rem, calc(100dvh - 2.25rem))"
  initialFocus="input[type=search]"
  header="Search documentation"
  ariaLabel="Search documentation"
  closeAriaLabel="Close documentation search"
  [closeOnBackdropClick]="true"
>
  <div class="docs-command">
    <aeris-icon-field size="lg" fluid>
      <svg aerisIconStart [lucideIcon]="icons.Search" aria-hidden="true"></svg>
      <input
        aerisInputText
        size="lg"
        fluid
        type="search"
        placeholder="Search guides and components..."
        aria-label="Search guides and components"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
    </aeris-icon-field>

    <div class="docs-command__summary">
      <span>Guides and components</span>
      <span>{{ results().length }} shown</span>
    </div>

    <nav class="docs-command__results" aria-label="Documentation search results">
      @for (item of results(); track item.path) {
        <a
          aerisButton
          class="docs-command__result"
          variant="ghost"
          size="md"
          [routerLink]="item.path"
          (pointerenter)="prefetchRoute(item.path)"
          (pointerdown)="prefetchRoute(item.path)"
          (focus)="prefetchRoute(item.path)"
          (click)="visible.set(false)"
        >
          <span class="docs-command__result-icon" aria-hidden="true">
            <svg [lucideIcon]="item.kind === 'guide' ? icons.BookOpen : icons.Package"></svg>
          </span>
          <span class="docs-command__result-copy">
            <strong>{{ item.name }}</strong>
            <small>{{ item.category }}</small>
          </span>
          <svg
            class="docs-command__result-arrow"
            [lucideIcon]="icons.ChevronRight"
            aria-hidden="true"
          ></svg>
        </a>
      } @empty {
        <p class="docs-command__empty" role="status">No documentation matches “{{ query() }}”.</p>
      }
    </nav>
  </div>
</aeris-dialog>
