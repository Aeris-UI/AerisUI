<aeris-command-palette
  [(open)]="visible"
  [(query)]="query"
  [commands]="commands()"
  [filter]="false"
  title="Search documentation"
  searchAriaLabel="Search guides and components"
  resultsAriaLabel="Documentation search results"
  placeholder="Search guides and components..."
  closeAriaLabel="Close documentation search"
  width="38.75rem"
  helpText="Use arrow keys to navigate, Enter to open and Escape to close."
  (executed)="navigate($event)"
>
  <ng-template aerisCommandPaletteItem let-command>
    <span
      class="docs-command__result"
      (pointerenter)="prefetchRoute(command.id)"
      (pointerdown)="prefetchRoute(command.id)"
    >
      <span class="docs-command__result-icon" aria-hidden="true">
        <svg [lucideIcon]="command.icon === 'guide' ? icons.BookOpen : icons.Package"></svg>
      </span>
      <span class="docs-command__result-copy">
        <strong>{{ command.label }}</strong>
        <small>{{ command.description }}</small>
      </span>
      <svg
        class="docs-command__result-arrow"
        [lucideIcon]="icons.ChevronRight"
        aria-hidden="true"
      ></svg>
    </span>
  </ng-template>
  <ng-template aerisCommandPaletteEmpty> No documentation matches “{{ query() }}”. </ng-template>
</aeris-command-palette>
