<section class="showcase-gallery" aria-label="Aeris product examples">
  <aeris-tabs
    variant="pill"
    size="sm"
    ariaLabel="Choose a product example"
    [value]="activeView()"
    (valueChange)="selectView($event)"
  >
    @for (option of options; track option.id) {
      <aeris-tab-panel [value]="option.id" [label]="option.label">
        <ng-template aerisTabHeader>
          <span class="showcase-gallery__tab-label">
            <svg [lucideIcon]="option.icon" aria-hidden="true"></svg>
            {{ option.label }}
          </span>
        </ng-template>
        <ng-template aerisTabContent>
          <div
            #viewport
            class="showcase-gallery__viewport"
            tabindex="0"
            role="region"
            [attr.aria-label]="option.label + ' example'"
            [attr.data-view]="option.id"
          >
            @defer (on viewport; prefetch on idle) {
              <app-aeris-showcase-content
                [activeView]="option.id"
                (viewRequested)="selectView($event)"
              />
            } @placeholder {
              <div class="showcase-gallery__loading" aria-hidden="true">
                <aeris-skeleton shape="rectangle" height="100%" />
                <aeris-skeleton shape="rectangle" height="100%" />
                <aeris-skeleton shape="rectangle" height="100%" />
              </div>
            }
          </div>
        </ng-template>
      </aeris-tab-panel>
    }
  </aeris-tabs>
  <nav class="showcase-gallery__links" aria-label="Components used in this example">
    <span>Explore these components</span>
    @for (link of documentationLinks(); track link.path) {
      <a [routerLink]="link.path">{{ link.label }}</a>
    }
  </nav>
</section>
